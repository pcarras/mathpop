<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coeficientes da função objetivo · Matemática I</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/pl.css">
<style>
.gl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px;align-items:start}
@media(max-width:820px){.gl{grid-template-columns:minmax(0,1fr);gap:0}.gl>div{display:contents}.c-prob{order:1}.c-sl{order:2}.c-graph{order:3}}
.pre{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pre button{padding:5px 10px;font-size:14px}
.iv{font-size:20px;margin:4px 0}
.q{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;line-height:2}
.q input[type=text]{width:5em;text-align:center}
#live{min-height:3em}
</style></head>
<body><div class="wrap">
<div id="hd"></div>
<div class="gl">
 <div>
  <div class="card c-prob"><h2>1. O problema</h2>
   <div id="ed"></div>
   <div class="pre" id="pre"></div>
  </div>
  <div class="card c-sl"><h2>2. Altere os coeficientes</h2>
   <div class="sl" id="sl"></div>
   <div class="btns"><button class="sec" id="rs">Repor os valores do problema</button></div>
   <div id="live"></div>
  </div>
 </div>
 <div>
  <div class="card c-graph"><h2>3. Gráfico</h2>
   <div class="cw" id="cw"><canvas id="cv" role="img" aria-label="Gráfico com o CSA e a reta da função objetivo a rodar quando os coeficientes mudam"></canvas></div>
   <div class="leg" id="leg"></div>
  </div>
 </div>
</div>
<div class="grid2">
 <div class="card"><h2>4. Intervalos de variação</h2><div id="iv"></div></div>
 <div class="card plain"><h2>5. Pergunta típica de teste</h2>
  <div class="q"><span>Se o</span><span id="qw">lucro unitário</span><span>de</span><select id="qv"></select><span>passar a</span><span style="white-space:nowrap"><input type="text" id="qx" value="50" aria-label="novo valor do coeficiente">, a solução</span><span>ótima altera-se?</span></div>
  <div class="btns"><button id="qb">Responder</button><button class="sec" id="qg">Ver no gráfico</button></div>
  <div id="qa"></div>
 </div>
</div>
<div id="ft"></div></div>
<script src="../assets/common.js"></script>
<script src="../assets/pl.js"></script>
<script>
el('hd').innerHTML=header('Tema 2 · Capítulo 7 · Alteração dos coeficientes da função objetivo','Coeficientes da função objetivo','Mude c₁ e c₂ e veja a reta da função objetivo rodar. A solução ótima mantém-se enquanto o declive −c₁/c₂ ficar entre os declives das restrições saturadas.');
el('ft').innerHTML=footer();
const {vHTML,vTxt,cHTML,cTxt,REL,ptHTML,ptTxt}=PL;
const PRE=[
 ['Exemplo do caderno',PL.make('max',[30,20],[[3,1],[1,2]],['<=','<='],[150,100])],
 ['Dieta',PL.make('min',[4,6],[[2,1],[1,2],[5,6]],['>=','>=','>='],[420,500,2100])],
 ['Ficha prática',PL.make('min',[3,5],[[1,2],[3,0],[1,5]],['<=','>=','>='],[410,450,500])]];
const cv=el('cv'),plot=new PL.Plot(cv,el('cw'),{ratio:.8,maxW:680});
let lp=null,G0=null,cc=null,V=null,rows=[];
const ed=PL.editor(el('ed'),{nFixed:true,n:2,m:2,mMin:1,mMax:5},()=>recompute());
PRE.forEach(([nm,p])=>{const b=document.createElement('button');b.className='sec';b.textContent=nm;b.onclick=()=>{[...el('pre').children].forEach(x=>x.classList.toggle('on',x===b));ed.set(p)};el('pre').appendChild(b)});
const with_c=(c)=>PL.make(lp.sense,c,lp.A,lp.rel,lp.b,lp.names);
const better=s=>lp.sense==='max'?s>0:s<0;
/* intervalo de c_k (o outro fixo) para o qual o vértice v se mantém ótimo: c·(w − v) não melhora para todos os vértices w e raios d */
function interval(G,v,c,k){
  let lo=null,hi=null,ok=true;const o=1-k;
  const conds=G.verts.filter(w=>w!==v).map(w=>[w.x.sub(v.x),w.y.sub(v.y)]).concat(G.rays.map(d=>[d[0],d[1]]));
  conds.forEach(d=>{ /* max: c_k·d_k + c_o·d_o ≤ 0 ; min: ≥ 0 */
    let a=d[k],r=c[o].mul(d[o]).neg();if(lp.sense==='min'){a=a.neg();r=r.neg()}
    if(a.isZero()){if(PL.sgn(r)<0)ok=false;return}
    const t=r.div(a);if(PL.sgn(a)>0){if(hi===null||PL.cmpF(t,hi)<0)hi=t}else{if(lo===null||PL.cmpF(t,lo)>0)lo=t}});
  return{lo,hi,ok};
}
function ivHTML(I,k){const n='c<sub>'+(k+1)+'</sub>';if(!I.ok)return 'vazio';
  if(I.lo===null&&I.hi===null)return n+' ∈ ℝ';if(I.lo===null)return n+' ≤ '+I.hi.html();if(I.hi===null)return n+' ≥ '+I.lo.html();return I.lo.html()+' ≤ '+n+' ≤ '+I.hi.html()}
function inI(I,x){return I.ok&&(I.lo===null||PL.cmpF(x,I.lo)>=0)&&(I.hi===null||PL.cmpF(x,I.hi)<=0)}
function atEdge(I,x){return (I.lo&&x.eq(I.lo))||(I.hi&&x.eq(I.hi))}
function recompute(){
  lp=ed.get();if(!lp){el('iv').innerHTML='<div class="err">Há um coeficiente inválido (assinalado a vermelho).</div>';return}
  G0=PL.graph2(lp);V=G0.opt?G0.opt[0]:null;cc=lp.c.slice();
  buildSliders();plot.fit();plot.auto(lp,G0);
  const word=lp.sense==='max'?'lucro unitário':'custo unitário';el('qw').textContent=word;
  const qv=el('qv');qv.innerHTML='';lp.names.forEach((n,j)=>{const o=document.createElement('option');o.value=j;o.textContent=vTxt(n);qv.appendChild(o)});
  el('qx').value=PL.inTxt(lp.c[0].add(new Fr(20))).replace('.',',');el('qa').innerHTML='';
  intervals();update();
}
function buildSliders(){
  const box=el('sl');box.innerHTML='';rows=[];
  const R=Math.max(10,...lp.c.map(x=>Math.abs(x.val())))*3;const st=PL.niceStep(R,120);const dec=Math.max(0,-Math.floor(Math.log10(st)+1e-9));
  const neg=lp.c.some(x=>x.n<0);
  lp.c.forEach((c,j)=>{
    const n=document.createElement('label');n.className='n math';n.innerHTML='c<sub>'+(j+1)+'</sub>';
    const sl=document.createElement('input');sl.type='range';sl.min=(neg?-R:0).toFixed(dec);sl.max=(Math.ceil(R/st)*st).toFixed(dec);sl.step=st.toFixed(dec);sl.value=c.val();sl.setAttribute('aria-label','coeficiente de '+vTxt(lp.names[j])+' na função objetivo');
    const inp=document.createElement('input');inp.type='text';inp.value=PL.inTxt(c);inp.setAttribute('aria-label','valor de c'+(j+1));
    sl.addEventListener('input',()=>{const f=parseFr(sl.value);cc[j]=f;inp.value=PL.inTxt(f);inp.classList.remove('badin');update()});
    inp.addEventListener('input',()=>{const f=parseFr(inp.value);if(!f){inp.style.borderColor='var(--red)';return}inp.style.borderColor='';cc[j]=f;sl.value=f.val();update()});
    box.append(n,sl,inp);rows.push({sl,inp});
  });
}
function setC(c){cc=c.slice();rows.forEach((r,j)=>{r.sl.value=cc[j].val();r.inp.value=PL.inTxt(cc[j]);r.inp.style.borderColor=''});update()}
function activeAt(v){const out=[];lp.A.forEach((r,i)=>{if(PL.lhs(lp,i,[v.x,v.y]).eq(lp.b[i]))out.push({i,a:r[0],b:r[1]})});if(v.y.isZero())out.push({i:-2,a:Fr.ZERO,b:Fr.ONE});if(v.x.isZero())out.push({i:-1,a:Fr.ONE,b:Fr.ZERO});return out}
const slope=(a,b)=>b.isZero()?null:a.div(b).neg();
const lineName=L=>L.i===-1?vHTML(lp.names[0])+' = 0 (eixo vertical)':L.i===-2?vHTML(lp.names[1])+' = 0 (eixo horizontal)':'('+(L.i+1)+') '+PL.linHTML([L.a,L.b],lp.names)+' = '+cHTML(lp.b[L.i]);
function intervals(){
  if(!V||G0.status==='ilimitado'||G0.status==='impossivel'){el('iv').innerHTML='<div class="err">O problema original '+(G0.status==='impossivel'?'é impossível':'não tem ótimo')+': a análise dos coeficientes só faz sentido a partir de uma solução ótima.</div>';return}
  const n=lp.names;let h='<p>Solução ótima do problema original: <b class="math">'+ptHTML(V.x,V.y)+'</b>, com z* = '+cHTML(V.z)+'.'+(G0.status==='multiplas'?' <span class="note">(há ótimos múltiplos; usa-se este vértice)</span>':'')+'</p>';
  const act=activeAt(V);
  if(act.length===2&&!lp.c[1].isZero()){
    const s=act.map(L=>slope(L.a,L.b));const fo=slope(lp.c[0],lp.c[1]);
    h+='<p>Restrições saturadas no ótimo e respetivos declives:</p><ul>'+act.map((L,k)=>'<li class="math">'+lineName(L)+': declive '+(s[k]===null?'infinito (reta vertical)':s[k].html())+'</li>').join('')+'</ul>';
    h+='<p>Declive da reta da função objetivo: <span class="math">−c<sub>1</sub>/c<sub>2</sub> = −'+cHTML(lp.c[0])+'/'+cHTML(lp.c[1])+' = '+fo.html()+'</span>.';
    if(s.every(x=>x!==null)){const lo=PL.cmpF(s[0],s[1])<0?s[0]:s[1],hi=lo===s[0]?s[1]:s[0];h+=' A solução mantém-se ótima enquanto <span class="math">'+lo.html()+' ≤ −c<sub>1</sub>/c<sub>2</sub> ≤ '+hi.html()+'</span>.'}
    h+='</p>';
  }else if(act.length>2)h+='<p class="note">O vértice ótimo é degenerado (mais de duas retas passam nele); os intervalos calculam-se comparando o valor de z em todos os vértices.</p>';
  const I1=interval(G0,V,lp.c,0),I2=interval(G0,V,lp.c,1);
  h+='<p>Com c<sub>2</sub> = '+cHTML(lp.c[1])+' fixo:</p><p class="math iv" style="text-align:center">'+ivHTML(I1,0)+'</p>';
  h+='<p>Com c<sub>1</sub> = '+cHTML(lp.c[0])+' fixo:</p><p class="math iv" style="text-align:center">'+ivHTML(I2,1)+'</p>';
  h+='<p class="note">Dentro do intervalo a solução ótima '+ptHTML(V.x,V.y)+' não muda (só muda o valor de z*). Nos extremos a reta da função objetivo fica paralela a uma restrição saturada: há ótimos múltiplos.</p>';
  el('iv').innerHTML=h;
}
function update(){
  if(!lp)return;const L=with_c(cc);const G=PL.graph2(L);
  let h='';const c1=cHTML(cc[0]),c2=cHTML(cc[1]);
  h+='<p class="math">z = '+PL.linHTML(cc,lp.names)+'</p>';
  if(!G.opt){h+='<div class="err">'+(G.status==='impossivel'?'O CSA é vazio.':'Com estes coeficientes o problema não tem ótimo: z '+(lp.sense==='max'?'cresce':'decresce')+' sem limite no CSA.')+'</div>'}
  else{const keep=V&&G.opt.includes(G.verts.find(w=>w.x.eq(V.x)&&w.y.eq(V.y)));
    const zV=V?PL.dot(cc,[V.x,V.y]):null;
    if(G.status==='multiplas'&&!G.nulo){const P=G.opt[0],Q=G.opt[G.opt.length-1];
      const par=[];lp.A.forEach((r,i)=>{if(G.opt.length>1&&PL.lhs(lp,i,[P.x,P.y]).eq(lp.b[i])&&PL.lhs(lp,i,[Q.x,Q.y]).eq(lp.b[i]))par.push('('+(i+1)+')')});
      h+='<div class="warn"><b>Ótimos múltiplos:</b> o declive da reta da função objetivo coincide com o '+(par.length?'da restrição '+par.join(' e '):'de um lado do CSA')+'. '+(G.opt.length>1?'Todo o segmento entre '+ptHTML(P.x,P.y)+' e '+ptHTML(Q.x,Q.y)+' é ótimo':'Toda uma semirreta é ótima')+', com z* = '+cHTML(G.zStar)+'.</div>'}
    else if(keep)h+='<div class="good">A solução ótima <b>mantém-se</b> em '+ptHTML(V.x,V.y)+'. O valor ótimo passa a z* = '+c1+'·'+V.x.html()+' + '+c2+'·'+V.y.html()+' = <b>'+cHTML(zV)+'</b>.</div>';
    else{const P=G.opt[0];h+='<div class="err">A solução ótima <b>muda</b> para '+ptHTML(P.x,P.y)+', com z* = <b>'+cHTML(G.zStar)+'</b>.'+(V?' O vértice antigo '+ptHTML(V.x,V.y)+' daria só z = '+cHTML(zV)+'.':'')+'</div>'}
  }
  el('live').innerHTML=h;draw(L,G);
}
function draw(L,G){
  const c=plot.C();plot.base(lp.names);const csa=plot.constraints(lp,{shade:false});
  const c1=cc[0].val(),c2=cc[1].val();
  if(V){const act=activeAt(V);act.forEach(A=>{if(A.i>=0)plot.line(A.a.val(),A.b.val(),lp.b[A.i].val(),PL.rgba(c[PL.CCOL[A.i%5].slice(2)],.9),4)})}
  if(G.status==='multiplas'&&G.opt.length>1){const P=G.opt[0],Q=G.opt[G.opt.length-1];plot.segment([P.x.val(),P.y.val()],[Q.x.val(),Q.y.val()],PL.rgba(c.red,.75),7)}
  if(G.opt&&!(c1===0&&c2===0)){const P=G.opt[0];const z=G.zStar.val();const s=plot.line(c1,c2,z,c.red,2.4,[8,6]);
    if(s){const px=plot.X(P.x.val()),py=plot.Y(P.y.val());let dx=plot.Y(s[1][1])-plot.Y(s[0][1]),dy=-(plot.X(s[1][0])-plot.X(s[0][0]));const Ln=Math.hypot(dx,dy)||1;dx/=Ln;dy/=Ln;
      const q=plot.inv(px+dx*10,py+dy*10);if((lp.sense==='max')!==(c1*q[0]+c2*q[1]>z)){dx=-dx;dy=-dy}plot.arrow(px+dx*8,py+dy*8,px+dx*44,py+dy*44,c.red,2.4);[.4,.8,1].forEach(k=>plot.reserve(px+dx*44*k,py+dy*44*k,9))}}
  G.verts.forEach(P=>{const o=G.opt&&G.opt.includes(P),b=V&&P.x.eq(V.x)&&P.y.eq(V.y);plot.dot(P.x.val(),P.y.val(),o?7:5,o?c.red:c.navy,b&&!o?c.red:c.bg,2);plot.reserve(plot.X(P.x.val()),plot.Y(P.y.val()),7)});
  G.verts.forEach(P=>{const o=G.opt&&G.opt.includes(P);plot.text(ptTxt(P.x,P.y),plot.X(P.x.val()),plot.Y(P.y.val()),o?c.red:c.navy)});
  el('leg').innerHTML='<span><b class="sq" style="background:'+PL.rgba(c.teal,.45)+'"></b>CSA</span><span><i style="border-color:var(--navy);border-top-width:5px"></i>restrições saturadas no ótimo original</span><span><i class="d" style="border-color:var(--red)"></i>reta da função objetivo no ótimo</span>';
}
el('rs').onclick=()=>{if(lp)setC(lp.c)};
function answer(apply){
  if(!V){el('qa').innerHTML='<div class="err">O problema original não tem solução ótima.</div>';return}
  const k=+el('qv').value,x=parseFr(el('qx').value);if(!x){el('qa').innerHTML='<div class="err">Valor inválido.</div>';return}
  const c=lp.c.slice();c[k]=x;const I=interval(G0,V,lp.c,k);const o=1-k;
  const G=PL.graph2(with_c(c));const nm=vHTML(lp.names[k]),ck='c<sub>'+(k+1)+'</sub>';
  const word=lp.sense==='max'?'lucro unitário':'custo unitário';
  let h='<p>Com c<sub>'+(o+1)+'</sub> = '+cHTML(lp.c[o])+' fixo, a solução '+ptHTML(V.x,V.y)+' mantém-se ótima para <span class="math">'+ivHTML(I,k)+'</span>.</p>';
  const z=PL.dot(c,[V.x,V.y]);
  if(inI(I,x)&&!atEdge(I,x))h+='<div class="good"><b>Não se altera.</b> O novo '+word+' de '+nm+', '+cHTML(x)+', pertence ao intervalo. Os valores ótimos das variáveis são os mesmos e o valor ótimo passa a z* = '+c.map((cj,j)=>cHTML(cj)+'·'+[V.x,V.y][j].html()).join(' + ')+' = <b>'+cHTML(z)+'</b>.</div>';
  else if(inI(I,x)){const P=G.opt[0],Q=G.opt[G.opt.length-1];h+='<div class="warn"><b>A solução '+ptHTML(V.x,V.y)+' continua ótima, mas deixa de ser única.</b> '+ck+' = '+cHTML(x)+' é um extremo do intervalo: a reta da função objetivo fica paralela a uma restrição saturada e há ótimos múltiplos'+(G.opt.length>1?' (segmento entre '+ptHTML(P.x,P.y)+' e '+ptHTML(Q.x,Q.y)+')':'')+', com z* = '+cHTML(G.zStar||z)+'.</div>'}
  else if(!G.opt)h+='<div class="err"><b>Altera-se.</b> '+cHTML(x)+' está fora do intervalo e, com este coeficiente, o problema deixa de ter ótimo.</div>';
  else{const P=G.opt[0];h+='<div class="err"><b>Altera-se.</b> '+cHTML(x)+' está fora do intervalo ('+(I.hi&&PL.cmpF(x,I.hi)>0?cHTML(x)+' > '+I.hi.html():cHTML(x)+' < '+I.lo.html())+'). A nova solução ótima é <b>'+ptHTML(P.x,P.y)+'</b>, com z* = <b>'+cHTML(G.zStar)+'</b>'+(G.status==='multiplas'?' (com ótimos múltiplos)':'')+'.</div>'}
  el('qa').innerHTML=h;if(apply)setC(c);
}
el('qb').onclick=()=>answer(false);el('qg').onclick=()=>answer(true);
window.addEventListener('resize',()=>{if(!lp)return;plot.fit();update()});
if(window.matchMedia)matchMedia('(prefers-color-scheme:dark)').addEventListener('change',update);
{const h=location.hash.length>1?PL.fromHash(location.hash):null;if(h&&h.n===2&&h.m>=1&&h.m<=5){try{ed.set(h)}catch(e){el('pre').children[0].click()}}else el('pre').children[0].click()}
</script></body></html>
